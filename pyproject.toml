[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-cli"
version = "0.1.0"
description = "Transkripsi audio dan video lokal berbahasa Indonesia"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["faster-whisper>=1.1", "typer>=0.12", "rich>=13", "platformdirs>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
transcribe = "transcribe_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = ["slow: integration with a local tiny model (explicit opt-in)"]
